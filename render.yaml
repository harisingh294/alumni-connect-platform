# Render blueprint for Alumni Connect Platform on Render Free with Neon PostgreSQL.
# In PostgreSQL mode, state is stored in the managed database, so no persistent disk is needed.
services:
  - type: web
    name: alumni-connect-platform
    runtime: docker
    plan: free
    region: singapore        # same region as the Neon database (AWS ap-southeast-1); cannot be changed after creation
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_ENGINE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SANDBOX
        value: "off"
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
