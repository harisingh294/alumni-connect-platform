# Render blueprint. A persistent disk is required: without it the SQLite
# database (and every partner's data) is lost on each deploy.
services:
  - type: web
    name: alumni-connect
    runtime: docker
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: alumni-connect-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true  # random secret generated by Render, never committed
      - key: SANDBOX
        value: "on"          # loads the fictional reviewer sandbox on first start
      - key: PLATFORM_ADMIN_EMAIL
        sync: false          # set in the Render dashboard
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false          # set in the Render dashboard (12+ characters)
